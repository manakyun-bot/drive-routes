<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DriveRoutes">
<meta name="theme-color" content="#0e141b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>My Drive Routes</title>
<script>
/* 表示が出る前にライト／ダークを決める（ちらつき防止） */
try{
  var p=JSON.parse(localStorage.getItem('dr_theme')||'"auto"');
  document.documentElement.dataset.theme=(p==='dark'||(p==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches))?'dark':'light';
}catch(e){document.documentElement.dataset.theme='dark'}
</script>
<style>
:root{--bg:#0e141b;--panel:#17202b;--line:#2a3644;--text:#e8eef5;--muted:#8b9bb0;--blue:#4aa3ff;--onblue:#06121f;--green:#5ad19a;--amber:#ffb454;--mapbg:#101a24;color-scheme:dark}
html[data-theme="light"]{--bg:#f3f6fa;--panel:#ffffff;--line:#d3dce7;--text:#142030;--muted:#5b6c80;--blue:#1f78e0;--onblue:#ffffff;--green:#1f9d6a;--amber:#b36a00;--mapbg:#dfe6ee;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;border-bottom:1px solid var(--line)}
/* ライトのとき、iPhoneの時計などが白文字で見えるよう、いちばん上の帯だけ暗くする */
html[data-theme="light"] header{background:linear-gradient(#0e141b,#0e141b) no-repeat top left / 100% env(safe-area-inset-top,0px),var(--bg)}
.top{display:flex;align-items:center;gap:8px}
h1{flex:1;margin:0;font-size:22px;letter-spacing:.01em}
.ic{width:42px;height:42px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;font-size:19px}
.ic:active{background:var(--line)}
#q{width:100%;margin-top:10px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:16px}
main{padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 28px);max-width:640px;margin:0 auto}
#status{min-height:22px;margin:0 0 8px;color:var(--muted);font-size:14px}
#status.err{color:var(--amber)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px}
.map{position:relative;background:var(--mapbg);border-bottom:1px solid var(--line)}
.map svg{display:block;width:100%;height:auto}
.map svg.ov{position:absolute;left:0;top:0;width:100%;height:100%}
.map[data-id]{cursor:pointer}
.zm{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:9px;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;pointer-events:none}
.zm svg{width:16px;height:16px}
.pin{stroke:var(--bg)}
/* ダークのとき、白地図は暗い色に、写真は少し暗くする。淡色は変えない（ここの数字で調整できる） */
html[data-theme="dark"] .map svg.tiles{filter:invert(1) hue-rotate(180deg) brightness(.82) contrast(.92)}
html[data-theme="dark"][data-map="photo"] .map svg.tiles{filter:brightness(.7)}
html[data-theme="dark"][data-map="pale"] .map svg.tiles{filter:none}
.att-d{display:none}
html[data-theme="dark"]:not([data-map="pale"]) .att-d{display:inline}
html[data-theme="dark"]:not([data-map="pale"]) .att-l{display:none}
.body{padding:12px 14px 14px}
h2{margin:0 0 6px;font-size:15px;font-weight:600;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{margin:0 0 12px;color:var(--muted);font-size:13px;display:flex;gap:14px}
.act{display:flex;gap:8px;align-items:center}
.go{flex:1;text-align:center;background:var(--blue);color:var(--onblue);font-weight:700;text-decoration:none;padding:12px;border-radius:12px}
.go:active{filter:brightness(.85)}
.del{color:var(--muted);font-size:13px;text-decoration:none;border:1px solid var(--line);background:transparent;border-radius:10px;padding:10px 11px}
.map.big{position:relative;flex:1;min-height:0;border-bottom:0;touch-action:none}
.map.big svg{position:absolute;left:0;top:0;width:100%;height:100%}
.viewer,.viewer *{touch-action:none}
.viewer{position:fixed;inset:0;z-index:9;background:var(--bg);display:flex;flex-direction:column;overscroll-behavior:contain}
.viewer[hidden]{display:none}
.vbar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;border-bottom:1px solid var(--line);background:var(--bg)}
html[data-theme="light"] .vbar{background:linear-gradient(#0e141b,#0e141b) no-repeat top left / 100% env(safe-area-inset-top,0px),var(--bg)}
.vt{flex:1;min-width:0;font-size:15px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vinfo{padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 14px);border-top:1px solid var(--line);background:var(--panel)}
.vinfo .meta{margin:0 0 4px}
.vinfo .hint{margin:0 0 10px}
.vz{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0;-webkit-user-select:none;user-select:none}
.vinfo .go{display:block}
html.lock,html.lock body{overflow:hidden}
.empty{text-align:center;color:var(--muted);padding:48px 12px}
.sheet{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.6);display:flex;align-items:flex-end}
.sheet[hidden]{display:none}
.panel{width:100%;max-width:640px;margin:0 auto;background:var(--panel);border-radius:18px 18px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px)}
.panel h3{margin:0 0 12px;font-size:17px}
.panel label,.panel .lb{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.panel input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:11px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:15px}
.seg button.on{background:var(--blue);border-color:var(--blue);color:var(--onblue);font-weight:700}
.row{display:flex;gap:8px;margin-top:16px}
.row button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:15px}
.row .pri{background:var(--blue);border-color:var(--blue);color:var(--onblue);font-weight:700}
.hint{margin:6px 0 0;color:var(--muted);font-size:12px}
.ver{margin:14px 0 0;color:var(--muted);font-size:12px;text-align:center}
</style>
</head>
<body>
<header>
  <div class="top"><h1>My Drive Routes</h1><button class="ic" id="reload" aria-label="更新">↻</button><button class="ic" id="cfg" aria-label="設定">⚙</button></div>
  <input id="q" type="search" placeholder="ルートを検索" autocomplete="off">
</header>
<main><p id="status"></p><div id="list"></div></main>
<div class="viewer" id="viewer" hidden>
  <div class="vbar"><button class="ic" id="vclose" aria-label="閉じる">✕</button><div class="vt" id="vtitle"></div></div>
  <div class="map big" id="vmap"></div>
  <div class="vinfo"><p class="meta" id="vmeta"></p><p class="hint">ピンチで拡大・縮小／拡大中は1本指で移動／ダブルタップで閉じる</p><a class="go" id="vgo" rel="noopener">ナビを開始</a></div>
</div>
<div class="sheet" id="sheet" hidden><div class="panel">
  <h3>設定</h3>
  <span class="lb">表示</span>
  <div class="seg" id="theme"><button data-v="auto">自動</button><button data-v="light">ライト</button><button data-v="dark">ダーク</button></div>
  <span class="lb">地図</span>
  <div class="seg" id="mapsel"><button data-v="pale">淡色</button><button data-v="blank">白地図</button><button data-v="photo">写真</button></div>
  <p class="hint">白地図と写真は、県名や地名が出ません</p>
  <label for="url">GASのURL</label><input id="url" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
  <label for="tok">合言葉</label><input id="tok" type="password" autocomplete="off" autocapitalize="off">
  <div class="row"><button id="unhide">非表示を戻す</button></div>
  <div class="row"><button id="close">閉じる</button><button class="pri" id="save">保存して読み込む</button></div>
  <p class="ver">画面のバージョン：2026-11-21e ダブルタップで全画面を閉じる</p>
</div></div>
<script>
const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let routes=LS.get('dr_routes',[]),hidden=LS.get('dr_hidden',[]),query='';
function status(t,err){const s=$('#status');s.textContent=t;s.className=err?'err':''}

/* ===== 表示の切り替え（自動／ライト／ダーク） ===== */
const mq=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
function applyTheme(){
  const pref=LS.get('dr_theme','auto');
  const dark=pref==='dark'||(pref==='auto'&&mq&&mq.matches);
  document.documentElement.dataset.theme=dark?'dark':'light';
  const tc=document.querySelector('meta[name="theme-color"]');
  if(tc)tc.content=dark?'#0e141b':'#f3f6fa';
  document.querySelectorAll('#theme button').forEach(b=>b.classList.toggle('on',b.dataset.v===pref));
}
if(mq&&mq.addEventListener)mq.addEventListener('change',applyTheme);
$('#theme').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  LS.set('dr_theme',b.dataset.v);applyTheme();
};

/* ===== 地図の背景（国土地理院タイル） =====
   MAPS : 地図の種類。pale=淡色地図（地名あり） / blank=白地図（地名なし） / photo=写真（地名なし）
          max,min は使うズームの範囲（白地図は5〜14まで）。
   TU   : 1枚のタイルを画面上で何単位の大きさに描くか（既定256）。
          小さくするとタイルが細かくなり、地図の文字は小さく、見える範囲は広くなる。
*/
const BASE='https://cyberjapandata.gsi.go.jp/xyz/';
const MAPS={
  pale:{p:'pale/',e:'png',max:16,min:3},
  blank:{p:'blank/',e:'png',max:14,min:5},
  photo:{p:'seamlessphoto/',e:'jpg',max:16,min:3}
};
let mapType=LS.get('dr_map','pale');
if(!MAPS[mapType])mapType='pale';
function applyMap(){
  document.documentElement.dataset.map=mapType;
  document.querySelectorAll('#mapsel button').forEach(b=>b.classList.toggle('on',b.dataset.v===mapType));
}
$('#mapsel').onclick=e=>{
  const b=e.target.closest('button');if(!b||!MAPS[b.dataset.v])return;
  mapType=b.dataset.v;LS.set('dr_map',mapType);applyMap();render();
};
const TU=256;
const mx=(lng,z,u)=>(lng+180)/360*(u||TU)*Math.pow(2,z);
const my=(lat,z,u)=>{const s=Math.sin(lat*Math.PI/180);return(0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*(u||TU)*Math.pow(2,z)};

/* 道路線（polyline・精度5）を [{lat,lng},...] に戻す。おかしいデータなら空にして、直線表示にする */
function decodeLine(str){
  const out=[];
  if(typeof str!=='string'||!str)return out;
  if(/[^\x3f-\x7e]/.test(str))return [];
  let i=0,lat=0,lng=0;
  while(i<str.length){
    let b,sh=0,r=0;
    do{b=str.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5}while(b>=32);
    lat+=(r&1)?~(r>>1):(r>>1);
    sh=0;r=0;
    do{b=str.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5}while(b>=32);
    lng+=(r&1)?~(r>>1):(r>>1);
    const la=lat/1e5,ln=lng/1e5;
    if(!(la>=-90&&la<=90&&ln>=-180&&ln<=180))return [];
    out.push({lat:la,lng:ln});
    if(out.length>2000)return [];
  }
  return out;
}

/* o（省略可）: 全画面用の設定。W,H=描く枠の大きさ / pad=余白 / grow=地図を最大で何倍まで大きくするか */
function thumb(p,road,o){
  o=o||{};
  const W=o.W||320,H=o.H||160,pad=o.pad||24,M=MAPS[mapType];
  const rd=(road&&road.line)?decodeLine(road.line):[];
  const hasRoad=rd.length>=2;
  const all=hasRoad?p.concat(rd):p;
  // ルート全体が枠に収まる、いちばん大きいズームを選ぶ
  let z=M.min;
  for(let t=M.max;t>=M.min;t--){
    const xs=all.map(a=>mx(a.lng,t)),ys=all.map(a=>my(a.lat,t));
    if(Math.max(...xs)-Math.min(...xs)<=W-2*pad&&Math.max(...ys)-Math.min(...ys)<=H-2*pad){z=t;break}
  }
  // 全画面のときだけ、枠に余りがあれば、タイルを少し拡大して枠いっぱいに使う（上限 o.grow 倍）
  let tu=TU;
  if(o.grow){
    const bx=all.map(a=>mx(a.lng,z)),by=all.map(a=>my(a.lat,z));
    const sx=Math.max(...bx)-Math.min(...bx),sy=Math.max(...by)-Math.min(...by);
    const sc=Math.min((W-2*pad)/Math.max(sx,1),(H-2*pad)/Math.max(sy,1));
    tu=TU*Math.min(Math.max(sc,1),o.grow);
  }
  const xs=all.map(a=>mx(a.lng,z,tu)),ys=all.map(a=>my(a.lat,z,tu));
  const cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2;
  const ox=cx-W/2,oy=cy-H/2;
  const pt=p.map(a=>[mx(a.lng,z,tu)-ox,my(a.lat,z,tu)-oy]);
  const lp=hasRoad?rd.map(a=>[mx(a.lng,z,tu)-ox,my(a.lat,z,tu)-oy]):pt;
  const n=Math.pow(2,z);
  // 1枚目の層：地図のタイル（画面に入ったときに読み込む。ここでは data-src に入れておく）
  let tiles='';
  for(let ty=Math.floor(oy/tu);ty<=Math.floor((oy+H)/tu);ty++){
    if(ty<0||ty>=n)continue;
    for(let tx=Math.floor(ox/tu);tx<=Math.floor((ox+W)/tu);tx++){
      if(tx<0||tx>=n)continue;
      tiles+=`<image data-src="${BASE}${M.p}${z}/${tx}/${ty}.${M.e}" x="${(tx*tu-ox).toFixed(1)}" y="${(ty*tu-oy).toFixed(1)}" width="${(tu+0.6).toFixed(1)}" height="${(tu+0.6).toFixed(1)}"/>`;
    }
  }
  // 2枚目の層：ルート線・ピン・出典（ダークでも色を変えない）
  let g='';
  const pts=lp.map(a=>a[0].toFixed(1)+','+a[1].toFixed(1)).join(' ');
  g+=`<polyline points="${pts}" fill="none" stroke="#ffffff" stroke-opacity=".9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>`;
  g+=`<polyline points="${pts}" fill="none" stroke="#2f7fe0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  const dot=(a,c,r,t)=>`<circle class="pin" cx="${a[0].toFixed(1)}" cy="${a[1].toFixed(1)}" r="${r}" fill="${c}" stroke-width="2"/>`+(t?`<text x="${a[0].toFixed(1)}" y="${(a[1]+3.2).toFixed(1)}" font-size="9" font-weight="700" text-anchor="middle" fill="#06121f">${t}</text>`:'');
  for(let i=1;i<pt.length-1;i++)g+=dot(pt[i],'#4aa3ff',8,i);
  // ゴールは赤（Googleマップと同じ）。出発地とゴールが同じ場所（周回）のときは、赤の上に小さい緑
  const s0=pt[0],e0=pt[pt.length-1],loop=Math.hypot(s0[0]-e0[0],s0[1]-e0[1])<8;
  g+=dot(e0,'#ea4335',10,'');
  g+=dot(s0,'#5ad19a',loop?5.5:10,'');
  // 出典（地図が見えている間は常に表示。ダークは色を変えているので「加工」と書く）
  if(hasRoad)g+=`<g><rect x="0" y="${H-15}" width="176" height="15" fill="#ffffff" fill-opacity=".8"/><text x="4" y="${H-4}" font-size="9" fill="#333">© OpenStreetMap contributors / OSRM</text></g>`;
  g+=`<g class="att-l"><rect x="${W-64}" y="${H-15}" width="64" height="15" fill="#ffffff" fill-opacity=".8"/><text x="${W-4}" y="${H-4}" font-size="9" text-anchor="end" fill="#333">地理院タイル</text></g>`;
  g+=`<g class="att-d"><rect x="${W-92}" y="${H-15}" width="92" height="15" fill="#ffffff" fill-opacity=".8"/><text x="${W-4}" y="${H-4}" font-size="9" text-anchor="end" fill="#333">地理院タイルを加工</text></g>`;
  return `<svg class="tiles" viewBox="0 0 ${W} ${H}" aria-hidden="true">${tiles}</svg><svg class="ov" viewBox="0 0 ${W} ${H}" role="img" aria-label="ルートの地図">${g}</svg>`;
}

// カードが画面に近づいたら、地図のタイルを読み込む
function loadTiles(el){
  el.querySelectorAll('image[data-src]').forEach(i=>{
    i.setAttribute('href',i.getAttribute('data-src'));
    i.removeAttribute('data-src');
  });
}
const io=('IntersectionObserver' in window)?new IntersectionObserver(es=>{
  es.forEach(e=>{
    if(!e.isIntersecting)return;
    loadTiles(e.target);
    io.unobserve(e.target);
  });
},{rootMargin:'300px'}):null;

function render(){
  const q=query.trim().toLowerCase(),list=$('#list');list.textContent='';
  const vis=routes.filter(r=>!hidden.includes(r.id)&&(!q||(r.title+' '+r.points.map(p=>p.name).join(' ')).toLowerCase().includes(q)));
  if(!vis.length){const d=document.createElement('div');d.className='empty';d.textContent=routes.length?'該当するルートがありません':'ルートがありません。右上の更新を押してください';list.append(d);return}
  vis.forEach(r=>{
    const c=document.createElement('article');c.className='card';
    c.dataset.id=r.id;
    c.innerHTML=`<div class="map" data-id="1">${thumb(r.points,r.road)}<span class="zm" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg></span></div><div class="body"><h2></h2><p class="meta"><span class="d"></span><span class="n"></span><span class="k"></span></p><div class="act"><a class="go" rel="noopener">ナビを開始</a><button class="del" data-id="">非表示</button></div></div>`;
    c.querySelector('h2').textContent=r.title;
    c.querySelector('.d').textContent=r.date;
    c.querySelector('.n').textContent='経由 '+Math.max(r.points.length-2,0)+' か所';
    const k=c.querySelector('.k');
    if(r.road&&typeof r.road.m==='number'&&r.road.m>0){const km=r.road.m/1000;k.textContent='約'+(km<10?km.toFixed(1):Math.round(km))+'km'}else k.remove();
    c.querySelector('.go').href=r.url;
    c.querySelector('.del').dataset.id=r.id;
    list.append(c);
    const m=c.querySelector('.map');
    if(io)io.observe(m);else loadTiles(m);
  });
}
async function load(){
  const cfg=LS.get('dr_cfg',null);
  if(!cfg||!cfg.url||!cfg.token){openSheet();return}
  status('読み込み中…');
  try{
    const u=cfg.url.trim()+(cfg.url.includes('?')?'&':'?')+'token='+encodeURIComponent(cfg.token.trim());
    const r=await fetch(u,{cache:'no-store'});
    const j=await r.json();
    if(!j.ok)throw new Error(j.error==='unauthorized'?'合言葉が違います。設定を確認してください。':'サーバーでエラーが起きました。');
    routes=j.routes;LS.set('dr_routes',routes);status('');
  }catch(e){
    status(e.message&&e.message.length<40&&!/fetch|JSON|load/i.test(e.message)?e.message:'読み込めませんでした。URLと通信状態を確認してください。',true);
  }
  render();
}
function openSheet(){const c=LS.get('dr_cfg',{});$('#url').value=c.url||'';$('#tok').value=c.token||'';$('#sheet').hidden=false}
$('#reload').onclick=load;
$('#cfg').onclick=openSheet;
$('#close').onclick=()=>{$('#sheet').hidden=true};
$('#save').onclick=()=>{LS.set('dr_cfg',{url:$('#url').value,token:$('#tok').value});$('#sheet').hidden=true;load()};
$('#unhide').onclick=()=>{hidden=[];LS.set('dr_hidden',hidden);render();$('#sheet').hidden=true};
$('#q').oninput=e=>{query=e.target.value;render()};
/* ===== 地図の全画面表示（第1段階：静止した大きい地図） =====
   VIEW_GROW : 全画面のとき、地図を最大で何倍まで大きくするか（大きくするほど文字は大きく、少し粗くなる）。1にすると拡大なし。 */
const VIEW_GROW=1.5;
/* ===== 全画面地図の拡大・移動（第2段階 2-A：いまの地図の絵を拡大・移動する） =====
   ZMAX : 最大の拡大倍率（大きくするほど細部は見えるが、地図の絵は粗くなる） */
const ZMAX=5;
let zs=1,ztx=0,zty=0,gest=null;
const ptrs=new Map(),lastTap={t:0,x:0,y:0};
function zApply(){
  const z=$('#vz');if(!z)return;
  const m=$('#vmap'),w=m.clientWidth,h=m.clientHeight;
  zs=Math.min(Math.max(zs,1),ZMAX);
  ztx=Math.min(0,Math.max(w-w*zs,ztx));
  zty=Math.min(0,Math.max(h-h*zs,zty));
  z.style.transform=zs===1?'':'translate('+ztx+'px,'+zty+'px) scale('+zs+')';
}
(function(){
  const vm=$('#vmap');
  const rel=e=>{const b=vm.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top}};
  vm.addEventListener('pointerdown',e=>{
    try{vm.setPointerCapture(e.pointerId)}catch(x){}
    if(e.isPrimary)ptrs.clear();   // 最初の指のときは、前の操作の残りを捨てる
    const p=rel(e);ptrs.set(e.pointerId,{x:p.x,y:p.y});
    if(ptrs.size===1)gest={t:Date.now(),x0:p.x,y0:p.y,moved:false,multi:false};
    else if(gest)gest.multi=true;
    e.preventDefault();
  });
  vm.addEventListener('pointermove',e=>{
    if(!ptrs.has(e.pointerId))return;
    const p=rel(e),old=ptrs.get(e.pointerId);
    if(ptrs.size===1){
      if(gest&&Math.hypot(p.x-gest.x0,p.y-gest.y0)>12)gest.moved=true;
      if(zs>1&&gest&&gest.moved){ztx+=p.x-old.x;zty+=p.y-old.y;zApply()}
    }else if(ptrs.size===2){
      const ids=[...ptrs.keys()],o1=ptrs.get(ids[0]),o2=ptrs.get(ids[1]);
      const n1=e.pointerId===ids[0]?p:o1,n2=e.pointerId===ids[1]?p:o2;
      const d0=Math.hypot(o1.x-o2.x,o1.y-o2.y),d1=Math.hypot(n1.x-n2.x,n1.y-n2.y);
      const m0={x:(o1.x+o2.x)/2,y:(o1.y+o2.y)/2},m1={x:(n1.x+n2.x)/2,y:(n1.y+n2.y)/2};
      if(d0>0){
        const ns=Math.min(Math.max(zs*d1/d0,1),ZMAX);
        const cx=(m0.x-ztx)/zs,cy=(m0.y-zty)/zs;
        zs=ns;ztx=m1.x-cx*zs;zty=m1.y-cy*zs;zApply();
      }
      if(gest)gest.moved=true;
    }
    ptrs.set(e.pointerId,{x:p.x,y:p.y});
  });
  const pend=e=>{
    if(!ptrs.has(e.pointerId))return;
    const p=ptrs.get(e.pointerId);ptrs.delete(e.pointerId);
    if(e.type==='pointerup'&&gest&&!gest.moved&&!gest.multi&&ptrs.size===0&&Date.now()-gest.t<600){
      // 1回目のタッチ開始から2回目のタッチ開始までが 0.6 秒以内、場所が近ければダブルタップ
      if(gest.t-lastTap.t<600&&Math.hypot(p.x-lastTap.x,p.y-lastTap.y)<60){
        lastTap.t=0;ptrs.clear();gest=null;
        closeViewer();
        return;
      }else{lastTap.t=gest.t;lastTap.x=p.x;lastTap.y=p.y}
    }
    if(ptrs.size===0)gest=null;
  };
  vm.addEventListener('pointerup',pend);
  vm.addEventListener('pointercancel',pend);
  vm.addEventListener('lostpointercapture',pend);
  vm.addEventListener('dblclick',e=>e.preventDefault());
  document.addEventListener('gesturestart',e=>{if(viewId!==null)e.preventDefault()});
})();
let viewId=null,drawSize={w:0,h:0},closedAt=0;
function drawViewer(){
  const r=routes.find(x=>String(x.id)===String(viewId));if(!r)return;
  const m=$('#vmap'),b=m.getBoundingClientRect();
  drawSize={w:Math.round(b.width),h:Math.round(b.height)};
  const W=360,H=Math.max(200,Math.round(W*b.height/Math.max(b.width,1)));
  m.innerHTML='<div class="vz" id="vz">'+thumb(r.points,r.road,{W:W,H:H,pad:34,grow:VIEW_GROW})+'</div>';
  zs=1;ztx=0;zty=0;ptrs.clear();gest=null;lastTap.t=0;
  loadTiles(m);
}
function openViewer(id){
  const r=routes.find(x=>String(x.id)===String(id));if(!r)return;
  viewId=id;
  $('#vtitle').textContent=r.title;
  const mt=$('#vmeta');mt.textContent='';
  const add=t=>{const s=document.createElement('span');s.textContent=t;mt.append(s)};
  add(r.date);
  add('経由 '+Math.max(r.points.length-2,0)+' か所');
  if(r.road&&typeof r.road.m==='number'&&r.road.m>0){const km=r.road.m/1000;add('約'+(km<10?km.toFixed(1):Math.round(km))+'km')}
  $('#vgo').href=r.url;
  $('#viewer').hidden=false;
  document.documentElement.classList.add('lock');
  drawViewer();
}
function closeViewer(){
  closedAt=Date.now();
  viewId=null;
  $('#viewer').hidden=true;
  $('#vmap').textContent='';
  document.documentElement.classList.remove('lock');
}
$('#vclose').onclick=closeViewer;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&viewId!==null)closeViewer()});
let rzT=null;
window.addEventListener('resize',()=>{
  if(viewId===null)return;
  clearTimeout(rzT);
  rzT=setTimeout(()=>{
    const m=$('#vmap');
    if(Math.abs(m.clientWidth-drawSize.w)>40||Math.abs(m.clientHeight-drawSize.h)>40)drawViewer();
  },200);
});
$('#list').onclick=e=>{
  const b=e.target.closest('.del');
  if(b){
    if(confirm('この一覧から隠します。Gmailのメールは消えません。')){hidden.push(b.dataset.id);LS.set('dr_hidden',hidden);render()}
    return;
  }
  const m=e.target.closest('.map');
  if(m&&Date.now()-closedAt>700){const c=m.closest('.card');if(c&&c.dataset.id)openViewer(c.dataset.id)}
};
applyTheme();applyMap();render();load();
</script>
</body>
